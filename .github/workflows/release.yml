name: Publicar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar extensiones
        run: |
          (cd chrome && zip -r ../youtube-clean-chrome.zip .)
          (cd firefox && zip -r ../youtube-clean-firefox.zip .)

      - name: Crear la release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          files: |
            youtube-clean-chrome.zip
            youtube-clean-firefox.zip
